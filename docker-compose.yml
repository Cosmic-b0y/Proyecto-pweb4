version: "3.8"

services:
  # ── MySQL (existente) ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: pweb4_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proyecto_pweb4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (nuevo) ─────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: pweb4_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proyecto_pweb4_mecanico
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ───────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pweb4_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── App: Microservicio Sistema Mecánico ─────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pweb4_mecanico
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: "mysql+aiomysql://root:root@mysql:3306/proyecto_pweb4"
      DATABASE_PG_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/proyecto_pweb4_mecanico"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  mysql_data:
  postgres_data:
